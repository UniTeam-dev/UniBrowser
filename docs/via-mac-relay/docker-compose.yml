# Сервер связи UniBrowser на VPS: iroh-relay 1.0.2 из официального образа n0.
# Положите рядом iroh-relay.toml и запустите: docker compose up -d
services:
  iroh-relay:
    image: n0computer/iroh-relay:v1.0.2
    command: ["--config-path", "/etc/iroh-relay.toml"]
    # Порты из конфига (127.0.0.1:8443, 127.0.0.1:3340, UDP 7842) слушаются прямо на хосте:
    # nginx на этом же сервере ходит на 127.0.0.1, а QUIC видит настоящие адреса клиентов.
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./iroh-relay.toml:/etc/iroh-relay.toml:ro
      # Весь каталог: файлы в live/ — ссылки на archive/.
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      RUST_LOG: info
