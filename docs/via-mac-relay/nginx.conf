# /etc/nginx/nginx.conf — сайт и сервер связи UniBrowser на одном VPS и одном порту 443.
# nginx stream читает SNI из TLS ClientHello (ssl_preread) и, не расшифровывая, отдаёт
# соединения для relay.example.ru серверу связи (127.0.0.1:8443), а остальные — своему же
# HTTPS-серверу сайта на 127.0.0.1:4443. Замените relay.example.ru и example.ru на свои имена.
# На Debian/Ubuntu модуль stream ставится пакетом libnginx-mod-stream (если `nginx -t`
# пишет unknown directive "stream").

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

stream {
    map $ssl_preread_server_name $backend {
        relay.example.ru  127.0.0.1:8443;   # сервер связи: TLS завершается в iroh-relay
        default           127.0.0.1:4443;   # всё остальное — сайт (TLS завершает nginx ниже)
    }

    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $backend;
        proxy_connect_timeout 5s;
        # Связь держит соединение с сервером связи часами; без этого nginx рвёт его через 10 мин тишины.
        proxy_timeout 1h;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Порт 80: сайт, проверки certbot для обоих имён и /generate_204 сервера связи
    # (им клиенты iroh проверяют captive portal).
    server {
        listen 80;
        listen [::]:80;
        server_name example.ru www.example.ru relay.example.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/letsencrypt;
        }
        location = /generate_204 {
            proxy_pass http://127.0.0.1:3340;
        }
        location / {
            return 301 https://example.ru$request_uri;
        }
    }

    # HTTPS сайта: доступен снаружи через stream на 443, сам слушает только локально.
    server {
        # nginx 1.25.1+ пишет здесь `listen 127.0.0.1:4443 ssl;` и `http2 on;` (старая форма тоже работает).
        listen 127.0.0.1:4443 ssl http2;
        server_name example.ru www.example.ru;

        ssl_certificate     /etc/letsencrypt/live/example.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.ru/privkey.pem;

        root /var/www/example.ru;
        index index.html;
    }
}
