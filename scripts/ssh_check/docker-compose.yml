# Test SSH server for `ssh_check --live`. Test-only credentials.
#   docker compose -f scripts/ssh_check/docker-compose.yml up -d
services:
  ssh:
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls239
    ports: ["127.0.0.1:2222:2222"]
    environment:
      USER_NAME: test
      USER_PASSWORD: test
      PASSWORD_ACCESS: "true"
      PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICR6Oht0ItGBTO2Nk97PrnrPNyWh2uw5ZUf5NU1vGd0k fixture"
    configs:
      - source: setup
        target: /custom-cont-init.d/setup.sh
        mode: 0755
configs:
  setup:
    content: |
      #!/bin/sh
      # bash login shell for `test` (autocomplete needs compgen), the fixture RSA key, `ssh -D` for the SOCKS check.
      apk add --no-cache bash
      sed -i 's#^\(test:.*:\)[^:]*$$#\1/bin/bash#' /etc/passwd
      grep -q ssh-rsa /config/.ssh/authorized_keys || echo "ssh-rsa  fixture" >> /config/.ssh/authorized_keys
      sed -i 's/^AllowTcpForwarding no/AllowTcpForwarding yes/' /config/sshd/sshd_config
