<!doctype html>
<!-- DevTools test page. Serve with scripts/devtools-test/serve.sh, open http://127.0.0.1:8000.
     The iframe comes from port 8001, so it is cross-origin. Panels add their cases here. -->
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>DevTools test</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="app-render.css">
  <script>
    // Logged at load, before the panel is open: must appear when it opens.
    console.log('main: load log', 42, { nested: { deep: [1, 2, 3] } });
    console.info('main: load info');
    console.warn('main: load warn');
    console.error('main: load error');
    console.debug('main: load debug');
    // Logged later, typically after the panel is open: must stream in.
    setTimeout(() => console.log('main: timer log after 5 s'), 5000);
  </script>
</head>
<body>
  <h1>DevTools test</h1>
  <button id="log" onclick="console.log('main: click', new Date().toISOString())">Лог из страницы</button>
  <!-- Консоль / Источники: every console method, errors, a bundle with a source map. -->
  <script src="console.js"></script>
  <button id="bundle-fail">Ошибка из бандла</button>
  <script src="bundle/app.js"></script>
  <p>Cross-origin iframe (page port + 1):</p>
  <iframe id="child" width="600" height="160"></iframe>
  <h2>Приложение и Рендеринг</h2>
  <div id="probe-media">
    <div id="probe-motion">prefers-reduced-motion: </div>
    <div id="probe-contrast">prefers-contrast: </div>
    <div id="probe-type">media type: </div>
    <div id="probe-scheme">prefers-color-scheme: </div>
    <div id="probe-width">viewport: </div>
  </div>
  <p class="swatches"><span style="background:#d00"></span><span style="background:#0a0"></span><span style="background:#00d"></span><span style="background:#dd0"></span></p>
  <p><button id="geo">Где я?</button> <span id="geo-out"></span></p>
  <noscript><p><b>JavaScript отключён</b></p></noscript>
  <pre id="render-probe"></pre>
  <script src="app-render.js"></script>
  <script>
    document.getElementById('child').src = location.protocol + '//' + location.hostname + ':' + (+location.port + 1) + '/frame.html';
  </script>
</body>
</html>
