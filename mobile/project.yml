name: UniBrowserMobile
options:
  bundleIdPrefix: app.unibrowser
  deploymentTarget:
    # IrohLib (the link to the Mac) needs iOS 17.5.
    iOS: "17.5"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  IrohLib:
    # QUIC tunnel with NAT traversal and relays for the link to the Mac.
    url: https://github.com/n0-computer/iroh-ffi
    exactVersion: 1.1.0
targets:
  UniBrowserMobile:
    type: application
    platform: iOS
    sources:
      - path: UniBrowserMobile
      # Shared with the macOS app. Read-only from here; changes go through the macOS side.
      # Spaces, groups and the palette:
      - path: ../UniBrowser/Models/Space.swift
        group: Shared
      # The session format the two apps mirror:
      - path: ../UniBrowser/Models/SessionSnapshot.swift
        group: Shared
      # Finds login forms and fills saved passwords:
      - path: ../UniBrowser/Web/LoginFormScript.swift
        group: Shared
      # The link's protocol, transport and merge:
      - path: ../Shared/ViaMac
      # History and bookmarks stores (docs/library-architecture.md):
      - path: ../Shared/Library
    dependencies:
      - package: IrohLib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ilya.browser
        # User-visible name of the .app, .ipa and the archive; the Swift module stays UniBrowserMobile.
        PRODUCT_NAME: UniBrowser
        PRODUCT_MODULE_NAME: UniBrowserMobile
        INFOPLIST_FILE: UniBrowserMobile/Resources/Info.plist
        # Ad-hoc подпись профилем "Ilya" (команда 7SJ59D8JGU). Для симулятора build.sh ставит CODE_SIGNING_ALLOWED=NO.
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: 7SJ59D8JGU
        PROVISIONING_PROFILE_SPECIFIER: Ilya
        CODE_SIGN_IDENTITY: Apple Distribution
        TARGETED_DEVICE_FAMILY: "1"
        # Swift 6 strict concurrency is on; UI types are @MainActor.
        SWIFT_STRICT_CONCURRENCY: complete
