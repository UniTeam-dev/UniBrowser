name: UniBrowser
options:
  bundleIdPrefix: app.unibrowser
  deploymentTarget:
    macOS: "15.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  IrohLib:
    # QUIC tunnel with NAT traversal and relays for the iPhone link.
    url: https://github.com/n0-computer/iroh-ffi
    exactVersion: 1.1.0
targets:
  UniBrowser:
    type: application
    platform: macOS
    sources:
      - path: UniBrowser
      # The iPhone link's protocol and merge, compiled into both apps.
      - path: Shared
    dependencies:
      - package: IrohLib
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.unibrowser.UniBrowser
        INFOPLIST_FILE: UniBrowser/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: UniBrowser/Resources/UniBrowser.entitlements
        CODE_SIGN_STYLE: Automatic
        # Swift 6 strict concurrency is on; UI types are @MainActor.
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_HARDENED_RUNTIME: YES
        # IrohLib ships an arm64-only macOS library.
        ARCHS: arm64
